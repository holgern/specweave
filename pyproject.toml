[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["specweave*"]

[tool.setuptools.package-data]
specweave = [
    "py.typed",
    "schemas/*.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
markers = [
    "specweave(feature, scenario, rule): maps a plain pytest test to a SpecWeave Gherkin scenario",
]

[project]
name = "specweave"
description = "Translate between Python tests, Gherkin behavior specs, and BDD execution evidence"
authors = [{name = "SpecWeave Contributors"}]
maintainers = [{name = "Holger Nahrstaedt"}]
requires-python = ">=3.10"
readme = "README.md"
license = "Apache-2.0"
keywords = ["bdd", "gherkin", "cucumber", "pytest", "testing", "developer-tools", "cli"]
dependencies = [
    "typer",
    "click",
    "tomli>=2; python_version < '3.11'",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: Utilities",
]

dynamic=["version"]

[project.scripts]
specweave = "specweave.launcher:main"

[project.urls]
Homepage = "https://github.com/holgern/specweave"
Repository = "https://github.com/holgern/specweave"
Issues = "https://github.com/holgern/specweave/issues"
Changelog = "https://github.com/holgern/specweave/releases"

[project.optional-dependencies]
gherkin = [
    "gherkin-official>=39,<40",
]
docs = [
    "myst-parser>=2",
    "sphinx>=7",
    "sphinx-rtd-theme>=2",
]
dev = [
    "build",
    "gherkin-official>=39,<40",
    "myst-parser>=2",
    "mypy",
    "pytest",
    "pytest-xdist",
    "ruff",
    "sphinx>=7",
    "sphinx-rtd-theme>=2",
    "twine",
    "types-PyYAML",
]

[tool.setuptools_scm]
write_to = "specweave/_version.py"

[tool.tox]
legacy_tox_ini = """

[testenv]
deps =
    pytest
commands =
    pytest -q -m 'not slow and not integration' {posargs}

[testenv:integration]
deps =
    pytest
    pytest-xdist
commands =
    pytest -q -m 'slow or integration' -n auto --dist=worksteal {posargs}

[testenv:full]
deps =
    pytest
    pytest-xdist
commands =
    pytest -q -n auto --dist=worksteal {posargs}
"""

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
exclude = [
]
